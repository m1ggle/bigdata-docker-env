#
# Flink 1.18 - common configuration
# Mounted into /opt/flink/conf of the jobmanager/taskmanager containers.
#
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123

jobmanager.memory.process.size: 1600m
taskmanager.memory.process.size: 1728m
taskmanager.numberOfTaskSlots: 2

parallelism.default: 2

# State backend (filesystem on HDFS by default; switch to rocksdb if needed)
state.backend: hashmap
state.checkpoints.dir: hdfs://namenode:9000/flink/checkpoints
state.savepoints.dir: hdfs://namenode:9000/flink/savepoints
execution.checkpointing.interval: 60s
execution.checkpointing.mode: EXACTLY_ONCE

# Web UI
rest.address: flink-jobmanager
rest.port: 8081

# Enable HDFS filesystem via bundled hadoop (flink "hadoop" flavour image)
# The image is started with `flink-hadoop` so this is available out of the box.
